{% extends 'base.html' %}
{% block title %}Вход — Карандаш{% endblock %}

{% block content %}
  <section class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card p-4">
            <h3 class="mb-3 text-center">Войти</h3>
            <form method="post">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="text" name="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input class="form-control" type="password" name="password" required>
              </div>
              <button class="btn btn-primary w-100" type="submit">Войти</button>
            </form>
            <div class="text-center mt-3">
              <a href="{% url 'register' %}">Нет аккаунта? Регистрация</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
